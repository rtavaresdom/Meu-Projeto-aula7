<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Tabela de Preços</title>
  <style>
    body {
      background-color: #EEE8AA;
      font-family: Arial, sans-serif;
      padding: 20px;
    }
    h2 {
      text-align: center;
    }
    table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 30px;
      background-color: #ffffff;
    }
    th, td {
      border: 1px solid #ccc;
      padding: 10px;
      text-align: left;
    }
    th {
      background-color: #f2f2f2;
    }
    a {
      display: inline-block;
      margin-top: 15px;
      padding: 8px 16px;
      background-color: #007bff;
      color: white;
      text-decoration: none;
      border-radius: 4px;
    }
  </style>
</head>
<body>

  <h2>TABELA DE PREÇOS</h2>

  <table>
    <thead>
      <tr>
        <th>CURSO</th>
        <th>TECNOLOGIA</th>
        <th>VALOR</th>
      </tr>
    </thead>
    <tbody>
      <tr>
        <td>CURSO ADS</td>
        <td>PYTHON</td>
        <td>R$ 119,99 MENSAL</td>
      </tr>
      <tr>
        <td>CURSO ADS</td>
        <td>HTML</td>
        <td>R$ 179,99 MENSAL</td>
      </tr>
      <tr>
        <td>CURSO ADS</td>
        <td>CSS</td>
        <td>R$ 169,90 MENSAL</td>
      </tr>
    </tbody>
  </table>

  <a href="index.html">Voltar</a>

</body>
</html>
